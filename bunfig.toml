[install]
# Our own SDK (gamerelay/sdk) is exempt from the 7-day minimumReleaseAge in ~/.bunfig.toml.
minimumReleaseAgeExcludes = ["@gamerelay/sdk"]

[test]
# CI's runners are about 3x slower than a laptop: open-ground tests (a bake, a field, a 40 s
# drive) take 2 s here and 5–7 s there, past bun's 5 s default.
timeout = 30000
